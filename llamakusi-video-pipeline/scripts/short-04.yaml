id: short-04
format: short
status: draft
pillar: E
product: fle_bridge
hook_formula: direct_promise
accent: gold
title: 3 mots de la préfecture que personne n'explique
cta_overlay: Lien en bio
blocks:
- id: hook
  voice: À la fin de cette vidéo, tu connais 3 mots qu'on va te dire à la préfecture — et que personne
    ne t'explique.
  mascot: perplexe
  overlay: 3 mots
  card:
    kind: terms
    data:
      label: Vocabulaire · Préfecture
      items:
      - term: Récépissé
        definition: Papier provisoire qui prouve que ta demande est en cours
      - term: Convocation
        definition: Le rendez-vous fixé, à l'heure exacte
      - term: Pièce justificative
        definition: Le document qui prouve ce que tu déclares
  visual_note: Overlay « 3 MOTS ». Mascotte perplexe.
- id: build
  voice: 'Le récépissé : un papier provisoire qui prouve que ta demande est en cours. La convocation :
    le rendez-vous fixé, à l''heure exacte, sans exception. La pièce justificative : le document qui prouve
    ce que tu déclares — un justificatif de domicile, par exemple.'
  mascot: reflechit
  card_from: hook
  visual_note: Carte générée, un mot à la fois.
- id: payoff
  voice: Trois mots. Trois pièges évités.
  mascot: victorieux
  card_from: hook
  card_state: revealed
  visual_note: Les 3 mots réaffichés ensemble, doré.
- id: loop
  voice: Et il y en a bien d'autres que personne ne prend le temps de t'expliquer.
  mascot: heureux
  card_from: hook
  visual_note: Retour au cadrage initial.
claims:
- text: 'Définitions : récépissé, convocation, pièce justificative'
  source_hint: service-public.fr (glossaire démarches préfecture)
