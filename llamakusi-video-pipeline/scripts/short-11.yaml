  visual_note: Retour à la carte initiale.
claims:
- text: À la section B de l'expression orale, l'examinateur joue volontairement un ami sceptique et ne sera jamais
    spontanément d'accord ; il évalue la capacité à rebondir sur des objections
  source_guide: reussir-expression-orale-section-b
- text: Face à une objection, il faut l'accueillir, la reformuler pour montrer qu'on l'a comprise, puis apporter
