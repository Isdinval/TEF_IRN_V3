- id: setup
  voice: Au programme. D'abord, ce que demande la section B. Ensuite, la méthode PRAC, avec un exemple. Puis, que
    faire quand l'examinateur refuse tes arguments. Et pour finir, comment passer du vouvoiement au tutoiement.
  mascot: reflechit
  card:
    kind: plan
    data:
      label: Au programme
      items:
      - title: Ce que demande la section B
        detail: Cinq minutes, un ami à convaincre
