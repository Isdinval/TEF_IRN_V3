publish:
  title_variants:
  - 'Expression orale TEF IRN section B : convaincre avec PRAC'
  - 'Expression orale TEF IRN : l''examinateur refuse ?'
  keyword: expression orale TEF IRN
  answer: Pour réussir la section B de l'expression orale du TEF IRN, applique la méthode PRAC (Présenter, Rassurer,
    Argumenter, Conclure) et rebondis sur chaque objection de l'examinateur, qui joue un ami sceptique.
  description: 'La section B de l''expression orale du TEF IRN dure 5 minutes : tu dois aider un ami, joué par
    l''examinateur, à prendre une décision. Sans méthode, le stress pousse à répéter les mêmes arguments et à perdre
    le fil. Dans cette vidéo, une structure simple en quatre étapes, la méthode PRAC, appliquée à un exemple complet.


    Ce que tu vas apprendre :

    • ce que demande la section B : un cadre informel et amical, un document à présenter, un ami à convaincre ;

    • pourquoi une structure fixe t''aide sous le stress : seuls les arguments changent, jamais le cadre ;

    • la méthode PRAC : Présenter, Rassurer, Argumenter, Conclure, avec un exemple pas à pas ;

    • comment rythmer les quatre étapes : moins de deux minutes pour garder du temps pour la relance de l''examinateur
    ;

    • que faire quand l''examinateur refuse tous tes arguments : accueillir l''objection, la reformuler, puis ajouter
    un argument complémentaire ;

    • comment préparer à l''avance deux objections classiques, le prix, le temps ou la motivation ;

    • comment passer du vouvoiement de la section A au tutoiement de la section B, un changement de registre
    qui fait partie de l''évaluation.


    Cette vidéo s''adresse aux candidats qui préparent le TEF IRN, notamment pour la naturalisation, et qui veulent
    arriver à l''oral avec un cadre clair plutôt que d''improviser. Pour t''entraîner face à un ami réticent, retrouve
    les liens ci-dessous.'
