blocks:
- id: hook
  voice: Convaincre un ami sceptique, pendant cinq minutes, face à un examinateur. À l'oral du TEF IRN, c'est exactement
    la section B. Sans méthode, on répète les mêmes arguments et on perd le fil. Dans cette vidéo, je te donne
    une méthode en quatre étapes, avec un exemple complet.
  mascot: perplexe
  chapter: Le piège de la section B
  card:
