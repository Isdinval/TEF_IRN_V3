title: 'Programme de l''examen civique : les 5 thèmes officiels'
thumbnail:
  text: "Le programme *officiel* en 5 thèmes"
publish:
  keyword: programme de l'examen civique
  answer: 'Le programme de l''examen civique se limite à 5 thématiques officielles, fixées par arrêté, réparties
    en 40 questions à passer en 45 minutes maximum.'
  description: 'Beaucoup de candidats révisent au hasard, question après question, sans savoir ce qui va vraiment
    tomber. Le programme de l''examen civique n''est pourtant pas flou : il tient en 5 thématiques précises, fixées
    par arrêté ministériel, et il ne porte jamais sur une notion qui n''a pas été présentée pendant la formation
    civique.


    Ce que tu vas apprendre dans cette vidéo :

    • les 5 thématiques officielles du programme : principes et valeurs de la République, système institutionnel
    et politique, droits et devoirs, histoire-géographie-culture, et vie dans la société française ;

    • la structure exacte du QCM : 40 questions en 45 minutes maximum, dont 28 questions de connaissance publiques
    et 12 questions de mise en situation jamais dévoilées à l''avance ;

    • un repère pour prioriser tes révisions si ton temps est limité, sans pour autant négliger les autres thèmes ;

    • un exemple réel traité en détail, sur le thème des valeurs de la République et de la laïcité ;

    • pourquoi réviser thématique par thématique, avec de vraies questions officielles, change tout par rapport
    à des fiches génériques.


    Pour t''entraîner gratuitement sur de vraies questions classées par thème, retrouve le lien vers LlamaKusi
    ci-dessous.'
  guide: programme-officiel-examen-civique-5-thematiques
