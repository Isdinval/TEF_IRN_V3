name: yt-snapshot

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python llamakusi-video-pipeline/tools/yt_snapshot.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
